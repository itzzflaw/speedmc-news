<script src="staff.js"></script>
<script src="app.js"></script>
<script>
function skinBody(username, size){
  return `https://mc-heads.net/body/${encodeURIComponent(username)}/${size}`;
}

function renderStaff(){
  const container = document.getElementById('staff-list');
  container.innerHTML = '';

  staffCategories.forEach(category => {
    if (!category.members || category.members.length === 0) return;

    const section = document.createElement('div');
    section.className = 'staff-category';

    const head = document.createElement('div');
    head.className = 'staff-category-head';
    head.innerHTML = `
      <span class="staff-category-bar ${category.key}"></span>
      <h2>${category.name}</h2>
    `;
    section.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'staff-grid';

    category.members.forEach(member => {
      const card = document.createElement('div');
      card.className = 'staff-card';
      card.innerHTML = `
        <img src="${skinBody(member.username, 200)}" alt="${member.displayName || member.username}" loading="lazy">
        <div class="staff-card-name">${member.displayName || member.username}</div>
        <span class="rank-badge ${rankClassMap[category.key] || ''}">${category.name}</span>
      `;
      grid.appendChild(card);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });
}

renderStaff();
</script>
</body>
