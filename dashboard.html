<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — SpeedMC Staff</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main">
    <div id="topbar-mount"></div>
    <div class="content">

      <div class="page-title">Dashboard</div>
      <div class="page-sub">Network overview and live activity.</div>

      <div class="stats-row">
        <div class="panel stat-card">
          <div class="stat-card-head">
            <div class="stat-card-icon green">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="17" cy="8" r="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M15.5 14.3c2.6.4 4.5 2.6 4.5 5.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </div>
          </div>
          <div class="stat-card-value" id="stat-players">—</div>
          <div class="stat-card-label">Active Players Online</div>
        </div>

        <div class="panel stat-card">
          <div class="stat-card-head">
            <div class="stat-card-icon blue">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </div>
          </div>
          <div class="stat-card-value" id="stat-tickets">—</div>
          <div class="stat-card-label">Open Tickets</div>
        </div>

        <div class="panel stat-card">
          <div class="stat-card-head">
            <div class="stat-card-icon red">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 3l8 3v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </div>
          </div>
          <div class="stat-card-value" id="stat-punishments">—</div>
          <div class="stat-card-label">Active Punishments</div>
        </div>

        <div class="panel stat-card">
          <div class="stat-card-head">
            <div class="stat-card-icon purple">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 17c0-1.7 1.8-3 4-3s4 1.3 4 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </div>
          </div>
          <div class="stat-card-value" id="stat-staff-online">—</div>
          <div class="stat-card-label">Staff Online</div>
        </div>
      </div>

      <div class="grid-2">
        <div class="panel card">
          <div class="card-head">
            <h3>Live Activity</h3>
            <span class="muted" style="margin-bottom:0;font-size:12px">Updates every 10s</span>
          </div>
          <div class="activity-list" id="activity-list">
            <div class="empty-state" style="padding:40px 20px">
              <p>Loading activity…</p>
            </div>
          </div>
        </div>

        <div class="panel card">
          <div class="card-head">
            <h3>Server Overview</h3>
            <span class="muted" style="margin-bottom:0;font-size:12px">Updates every 30s</span>
          </div>
          <div class="server-list" id="server-overview-list">
            <div class="empty-state" style="padding:30px 10px">
              <p>Loading server status…</p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="layout.js"></script>
<script>
const ACTIVITY_ICONS = {
  login: { bg: 'var(--green-soft)', color: 'var(--green)', svg: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
  ticket_reply: { bg: 'var(--blue-soft)', color: 'var(--blue)', svg: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>' },
  punishment_issue: { bg: 'var(--red-soft)', color: 'var(--red)', svg: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3l8 3v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>' },
  account_created: { bg: 'var(--purple-soft)', color: 'var(--purple)', svg: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' },
  default: { bg: 'var(--panel-2)', color: 'var(--text-dim)', svg: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/></svg>' }
};

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadActivity(){
  const listEl = document.getElementById('activity-list');
  try {
    const res = await fetch('/api/activity');
    const data = await res.json();
    if (!res.ok) {
      listEl.innerHTML = `<div class="empty-state" style="padding:40px 20px"><p>${data.error || 'Could not load activity.'}</p></div>`;
      return;
    }
    if (!data.activity || data.activity.length === 0) {
      listEl.innerHTML = '<div class="empty-state" style="padding:40px 20px"><p>No activity yet — actions taken by staff will show up here.</p></div>';
      return;
    }
    listEl.innerHTML = data.activity.map(a => {
      const icon = ACTIVITY_ICONS[a.action_type] || ACTIVITY_ICONS.default;
      const target = a.target ? ` <b>${escapeHtml(a.target)}</b>` : '';
      return `
        <div class="activity-item">
          <div class="activity-icon" style="background:${icon.bg};color:${icon.color}">${icon.svg}</div>
          <div class="activity-body">
            <div class="activity-text"><b>${escapeHtml(a.username)}</b> ${escapeHtml(a.label)}${target}</div>
            <div class="activity-time">${fmtRelative(a.created_at)}</div>
          </div>
        </div>
      `;
    }).join('');
  } catch {
    listEl.innerHTML = '<div class="empty-state" style="padding:40px 20px"><p>Could not reach the server.</p></div>';
  }
}

async function loadStaffOnline(){
  try {
    const res = await fetch('/api/online-staff');
    const data = await res.json();
    document.getElementById('stat-staff-online').textContent = data.count ?? '—';
  } catch {
    document.getElementById('stat-staff-online').textContent = '—';
  }
}

async function loadOpenTickets(){
  try {
    const res = await fetch('/api/tickets');
    const data = await res.json();
    const open = (data.tickets || []).filter(t => t.status !== 'closed').length;
    document.getElementById('stat-tickets').textContent = open;
  } catch {
    document.getElementById('stat-tickets').textContent = '—';
  }
}

function tpsClass(tps){
  if (tps >= 18) return 'good';
  if (tps >= 15) return 'warn';
  return 'bad';
}

async function loadServerStatus(){
  const listEl = document.getElementById('server-overview-list');
  try {
    const res = await fetch('/api/server-status');
    const data = await res.json();
    const servers = data.servers || [];

    document.getElementById('stat-players').textContent = (data.total_players ?? 0).toLocaleString();

    if (servers.length === 0) {
      listEl.innerHTML = '<div class="empty-state" style="padding:30px 10px"><p>No server data yet.</p></div>';
      return;
    }

    listEl.innerHTML = servers.map(s => {
      const dotClass = s.online ? 'online' : 'offline';
      const meta = s.online
        ? `${s.players.toLocaleString()}/${s.max_players.toLocaleString()} players`
        : 'Offline';
      const tpsLabel = s.online ? `${s.tps.toFixed(1)} TPS` : 'Offline';
      const tpsCls = s.online ? tpsClass(s.tps) : 'bad';

      return `
        <div class="server-row">
          <span class="dot ${dotClass}"></span>
          <div class="server-row-info">
            <div class="server-row-name">${escapeHtml(s.name)}</div>
            <div class="server-row-meta">${meta}</div>
          </div>
          <span class="server-row-tps ${tpsCls}">${tpsLabel}</span>
        </div>
      `;
    }).join('');
  } catch {
    listEl.innerHTML = '<div class="empty-state" style="padding:30px 10px"><p>Could not load server status.</p></div>';
  }
}

(async function(){
  const user = await initLayout('dashboard');
  if (!user) return;

  // Sample placeholder until a punishments system is wired up
  document.getElementById('stat-punishments').textContent = '23';

  loadStaffOnline();
  loadOpenTickets();
  loadServerStatus();
  loadActivity();
  setInterval(loadActivity, 10000);
  setInterval(loadStaffOnline, 15000);
  setInterval(loadOpenTickets, 15000);
  setInterval(loadServerStatus, 30000);
})();
</script>
</body>
</html>
