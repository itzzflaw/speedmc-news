<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedMC — Updates</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="logo">Speed<span>MC</span> <small>Updates</small></a>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="https://store.mc-speed.com" target="_blank">Store</a>
      <a href="https://discord.gg/speedmc" target="_blank">Discord</a>
      <a href="#" class="nav-play">play.mc-speed.com</a>
    </div>
  </div>
</nav>

<div class="content-layout">
  <div class="posts-wrap">
    <div class="posts" id="posts"></div>
    <div class="empty" id="empty" style="display:none">
      <p>No posts found for this filter.</p>
    </div>
  </div>

  <aside class="sidebar">
    <div class="sidebar-section">
      <h4>Category</h4>
      <div class="filter-group" id="tag-filter">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="update">Updates</button>
        <button class="filter-btn" data-filter="patch">Patches</button>
        <button class="filter-btn" data-filter="event">Events</button>
        <button class="filter-btn" data-filter="news">News</button>
      </div>
    </div>
    <div class="sidebar-section">
      <h4>Server</h4>
      <div class="filter-group" id="server-filter">
        <button class="filter-btn active" data-server="all">All</button>
        <button class="filter-btn" data-server="lifesteal">Lifesteal</button>
        <button class="filter-btn" data-server="oneblock">OneBlock</button>
        <button class="filter-btn" data-server="prison">Prison</button>
        <button class="filter-btn" data-server="network">Network</button>
      </div>
    </div>
    <div class="sidebar-section">
      <h4>Join us</h4>
      <a href="https://discord.gg/speedmc" class="sidebar-link" target="_blank">Discord</a>
      <a href="https://store.mc-speed.com" class="sidebar-link" target="_blank">Store</a>
    </div>
  </aside>
</div>

<footer>
  <div class="footer-inner">
    <span class="logo">Speed<span>MC</span></span>
    <span>play.mc-speed.com</span>
    <span>© 2026 SpeedMC</span>
  </div>
</footer>

<script src="posts.js"></script>
<script src="app.js"></script>
</body>
</html>
